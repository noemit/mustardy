[package]
name = "mustardy-core"
version = "0.1.1"
description = "Mustardy core: ffmpeg probe / silence scan / export"
authors = ["Mustardy"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mustardy_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
