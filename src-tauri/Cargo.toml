[package]
name = "mustardy-desktop"
version = "0.2.0"
description = "Mustardy — desktop video editor (Tauri + ffmpeg)"
authors = ["Mustardy"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "mustardy-desktop"
path = "src/main.rs"

[dependencies]
mustardy-core = { package = "mustardy", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
