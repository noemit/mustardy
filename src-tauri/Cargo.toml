[package]
name = "mustardy"
version = "0.1.1"
description = "Mustardy — video editor (Tauri + ffmpeg)"
authors = ["Mustardy"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[workspace]
members = ["core"]

[[bin]]
name = "mustardy"
path = "src/main.rs"

[dependencies]
mustardy-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
