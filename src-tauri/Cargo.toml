[package]
name = "mustardy"
version = "0.1.0"
description = "Mustardy — agentic video editor (Tauri + native inference)"
authors = ["Mustardy"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[workspace]
members = ["core", "ears-cli"]

[[bin]]
name = "mustardy"
path = "src/main.rs"

[dependencies]
mustardy-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = "thin"
codegen-units = 1
