[package]
name = "mustardy-ears-cli"
version = "0.1.0"
description = "Mustardy ears sidecar: whisper.cpp transcription as a standalone process"
authors = ["Mustardy"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "mustardy-ears"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"
