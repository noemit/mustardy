[package]
name = "mustardy"
version = "0.2.0"
description = "Fast offline CLI that trims silences from videos and audio using FFmpeg"
authors = ["Mustardy"]
license = "MIT"
repository = "https://github.com/noemit/mustardy"
homepage = "https://mustardy.com"
readme = "README.md"
keywords = ["video", "ffmpeg", "silence", "cli", "editing"]
categories = ["command-line-utilities", "multimedia::video", "multimedia::audio"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "mustardy_core"
path = "cli/src/lib.rs"

[[bin]]
name = "mustardy"
path = "cli/src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
